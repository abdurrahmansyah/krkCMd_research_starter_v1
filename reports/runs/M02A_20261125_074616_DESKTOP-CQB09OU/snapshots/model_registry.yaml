    - id: "DL01"
      name: "MLP"
      estimator: "sklearn.neural_network.MLPRegressor (prototype) / torch.nn.Sequential (target)"
      package: "scikit-learn (prototype); torch (target)"
      status: "SMOKE_TEST_PASS_PROTOTYPE"
      actual_implementation_tested: "sklearn.neural_network.MLPRegressor (ConvergenceWarning at max_iter=20)"
      pytorch_implementation_status: "NOT_EXECUTED"
      env: "env-baseline (prototype) / env-deep (target)"
      hardware: "CPU (prototype) / GPU/CPU (target)"
      complexity: "Low"
      license: "BSD-3-Clause"
      notes: "M01/M01-R smoke test verified sklearn MLPRegressor prototype only; do NOT propagate PASS to untested PyTorch MLP."

    - id: "DL02"
      name: "FT-Transformer"
      estimator: "rtdl_num_embeddings / FTTransformer"
      package: "torch, rtdl-num-embeddings"
      status: "CONDITIONAL"
      env: "env-deep"
      hardware: "GPU"
      complexity: "High"
      license: "Apache-2.0"
      notes: "Quadratic attention memory (501 features). Quadro RTX 6000 24 GB VRAM (sm_75) alleviates 4 GB OOM, runtime untested."

    - id: "DL03"
      name: "RealMLP"
      estimator: "pytabkit.RealMLP_TD_Regressor"
      package: "torch, pytabkit"
      status: "STATIC_REVIEW"
      env: "env-deep"
      hardware: "GPU/CPU"
      complexity: "Medium"
      license: "MIT"
      notes: "PyPI package is pytabkit (>=1.8.0), replacing placeholder tabbench.RealMLP."

    - id: "DL04"
      name: "TabR"
      estimator: "tabular-dl-tabr (repo)"
      package: "torch, faiss-cpu"
      status: "CONDITIONAL"
      env: "env-deep"
      hardware: "GPU/CPU"
      complexity: "High"
      license: "Apache-2.0"
      notes: "Requires FAISS retrieval index over training profiles and repo-based tabular-dl-tabr code (not on PyPI)."

    - id: "DL05"
      name: "TabM"
      estimator: "tabm.TabM"
      package: "torch, tabm, rtdl-num-embeddings"
      status: "STATIC_REVIEW"
      env: "env-deep"
      hardware: "GPU/CPU"
